<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css">
<style>body{width:1100px}.wrap{display:flex;gap:30px}.m{flex:1}.m h3{font-size:15px;text-align:center;margin-bottom:8px}
table{border-collapse:collapse;margin-left:auto;margin-right:auto}td{width:84px;height:62px;border:1px solid #fff;text-align:center;vertical-align:middle;font-size:13px;font-weight:bold;color:#1b1b1b}
td.lab{background:#fff;font-weight:normal;font-size:12px;width:70px;color:#333}tr.xl td{height:28px;background:#fff;font-weight:normal;font-size:12px}
.L{background:#cfe8d4}.M{background:#fff0b3}.H{background:#f8c48f}.V{background:#ef9a9a}
.yl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;text-align:center}
.leg{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:13px}.leg span{display:inline-block;width:16px;height:12px;margin-right:5px;vertical-align:middle}
.sc{font-weight:normal;font-size:11px;color:#555;display:block}</style></head><body>
<div class="wrap" id="w"></div>
<div class="leg"><div><span class="L"></span>Düşük (1–4)</div><div><span class="M"></span>Orta (5–9)</div><div><span class="H"></span>Yüksek (10–16)</div><div><span class="V"></span>Çok yüksek (20–25)</div></div>
<div style="font-size:12.5px;text-align:center;margin-top:8px;color:#333">Skor = Olasılık × Etki. R7 ve R8 yalnızca araç kullanıldığında ortaya çıkan yeni risklerdir. Hücre içindeki küçük sayı skoru gösterir.</div>
<script>
const before={R1:[5,4],R2:[5,4],R3:[3,5],R4:[4,3],R5:[3,4],R6:[3,3]};
const after ={R1:[2,3],R2:[2,3],R3:[2,5],R4:[1,3],R5:[1,4],R6:[3,3],R7:[3,3],R8:[2,4]};
function lvl(s){return s<=4?'L':s<=9?'M':s<=16?'H':'V'}
function mat(title,data){let h=`<div class="m"><h3>${title}</h3><table>`;
 for(let o=5;o>=1;o--){h+='<tr>'+(o==5?`<td class="lab" rowspan="5"><div class="yl">Olasılık →</div></td>`:'')+`<td class="lab">${o}</td>`;
  for(let e=1;e<=5;e++){const ids=Object.keys(data).filter(k=>data[k][0]==o&&data[k][1]==e);h+=`<td class="${lvl(o*e)}">${ids.join(', ')}<span class="sc">${o*e}</span></td>`}h+='</tr>'}
 h+='<tr class="xl"><td class="lab"></td><td class="lab"></td>'+[1,2,3,4,5].map(e=>`<td>${e}</td>`).join('')+'</tr>';
 h+='<tr class="xl"><td class="lab"></td><td class="lab"></td><td colspan="5">Etki →</td></tr></table></div>';return h}
document.getElementById('w').innerHTML=mat('(a) Araç kullanılmadan önce',before)+mat('(b) Araç ve idari tedbirlerle',after);
</script></body></html>
